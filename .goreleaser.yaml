version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: roamjev
    main: ./cmd/roamjev
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
      - amd64
      - arm
    goarm: ["7"]

archives:
  - id: roamjev
    ids: [roamjev]
    formats: [tar.gz]
    name_template: >-
      roamjev_
      {{- .Arch }}
    # Ship the unit inside the checksummed archive so the installer doesn't
    # have to fetch it separately, unverified.
    files:
      - LICENSE
      - README.md
      - systemd/roamjev@.service

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
